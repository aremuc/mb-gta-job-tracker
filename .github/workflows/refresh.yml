name: Refresh job tracker
on:
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: Search six weeks instead of seven days
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tracker/**', 'tests/**', 'config.json', 'requirements.txt', 'requirements-lock.txt', '.github/workflows/refresh.yml']
permissions:
  contents: write
concurrency:
  group: job-tracker-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - name: Test matching and preservation rules
        run: python -m unittest discover -s tests -v
      - name: Render existing jobs after code changes
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh-jobs]')
        run: python -m tracker.update --render-only
      - name: Collect and verify jobs
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-jobs]')
        id: refresh
        continue-on-error: true
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            python -u -m tracker.update --backfill
          else
            python -u -m tracker.update
          fi
      - name: Commit listings and source health
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html docs/ data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh job listings and source health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report failed collection
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Collection failed. Previous jobs were preserved; see docs/SOURCES.md and logs.'
          exit 1
